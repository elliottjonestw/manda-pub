    <style>
      /* Bootstrap loader shown until React mounts (and across the reload that a
         Cloud restore triggers), so there is no blank flash. Mirrors PageLoader. */
      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
      }
      html.dark #boot-loader {
        background: #1f2937;
      }
      #boot-loader > div {
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 9999px;
        border: 4px solid #e5e7eb;
        border-top-color: #6366f1;
        animation: boot-spin 0.8s linear infinite;
      }
      html.dark #boot-loader > div {
        border-color: #374151;
        border-top-color: #6366f1;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <div id="root">
      <div id="boot-loader"><div></div></div>
    </div>
    <script>
      ;(function () {
        // App data lives in IndexedDB (async, unavailable pre-paint), so the
        // theme is mirrored to this localStorage key by useSettings.
        var theme
        try {
          theme = localStorage.getItem('manda-theme')
        } catch (e) {}
        var dark =
          theme === 'dark' ||
          (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')

        var base = document.documentElement.dataset.pwaLaunch
        if (base) {
          // Restore the normal bootstrap spinner in place of prerendered HTML.
          // React replaces it on mount; there is no persistent overlay to clear.
          var root = document.getElementById('root')
          var loader = document.createElement('div')
          loader.id = 'boot-loader'
          loader.appendChild(document.createElement('div'))
          root.replaceChildren(loader)
          root.removeAttribute('data-mounted')
          try {
            // Select the initial route without another request or history entry.
            history.replaceState(
              history.state,
              '',
              base + 'dashboard' + location.search + location.hash,
            )
          } catch (e) {
            // App.tsx still redirects the root if history is unavailable.
          }
          delete document.documentElement.dataset.pwaLaunch
        }
      })()
    </script>
    <script>
      // Startup diagnostics only. React owns the mounted tree; a background
      // rejection must not replace it or interpret diagnostic text as HTML.
      function showStartupError(title, detail) {
        var root = document.getElementById('root')
        if (!root || root.dataset.mounted === 'true') return
        var box = document.createElement('pre')
        box.style.cssText = 'white-space:pre-wrap;padding:16px;color:#c00'
        box.textContent = title + '\n' + detail
        root.replaceChildren(box)
      }
      window.addEventListener('error', function (e) {
        if (!e.filename || e.message === 'Script error.') return
        showStartupError('JS Error', (e.message || 'unknown') + '\n' + e.filename + ':' + e.lineno)
      })
      window.addEventListener('unhandledrejection', function (e) {
        showStartupError('Unhandled Promise Rejection', e.reason?.message || String(e.reason))
      })
    </script>
